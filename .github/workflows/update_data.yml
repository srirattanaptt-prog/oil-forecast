name: Automated Oil Data Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # 🟢 ปรับเปลี่ยนจาก @v3 เป็น @v4 เพื่อรองรับระบบ Node.js 24 ล่าสุดของ GitHub เรียบร้อยครับ
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch Latest Data from Google Sheets
        run: |
          curl -L "https://script.google.com/macros/s/AKfycbwmWj0VWOYL8_RcqEUxeAe0CYX7zXUfNZft8VvP0Z3_RULFexidm1tctvSxAwxEYM8S3g/exec" -o oil_data.json

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add oil_data.json
          git commit -m "🤖 Force sync latest oil data" || echo "No changes to commit"
          git push
