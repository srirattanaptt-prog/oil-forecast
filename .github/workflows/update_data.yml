name: Automated Oil Data Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

# 🔐 เพิ่มส่วนนี้เพื่ออนุญาตให้บอทเขียนไฟล์ลงในคลังโค้ดได้อย่างปลอดภัย
permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: true # บังคับใช้สิทธิ์แบบยั่งยืน

      - name: Fetch Latest Data from Google Sheets
        run: |
          curl -L "https://script.google.com/macros/s/AKfycbwmWj0VWOYL8_RcqEUxeAe0CYX7zXUfNZft8VvP0Z3_RULFexidm1tctvSxAwxEYM8S3g/exec" -o oil_data.json

      - name: Commit and Push if Data Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oil_data.json
          
          # ตรวจสอบการเปลี่ยนแปลง ถ้าไม่มีอะไรใหม่จะไม่บันทึกซ้ำ
          if git diff --staged --quiet; then
            echo "No changes detected in oil data."
          else
            git commit -m "🤖 Auto-updated oil price data [Skip CI]"
            git push
          fi
